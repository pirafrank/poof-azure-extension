name: Publish Extension
run-name: Publish Extension to ${{ inputs.channel || 'preview' }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, production]
        default: preview
        required: true
      tested_commit:
        description: Full commit SHA that passed installed-extension Azure Pipelines tests (production only)
        type: string
      acceptance_run:
        description: Successful Azure Pipelines acceptance run URL (production only)
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-${{ inputs.channel || 'preview' }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      CHANNEL: ${{ inputs.channel || 'preview' }}
      MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
      MARKETPLACE_PUBLIC: ${{ inputs.channel == 'production' && vars.MARKETPLACE_PUBLIC || 'false' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate production release evidence
        if: inputs.channel == 'production'
        env:
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$TESTED_COMMIT" = "$GITHUB_SHA"
          [[ "$ACCEPTANCE_RUN" =~ ^https://dev\.azure\.com/[^/]+/[^/]+/_build/results\?buildId=[0-9]+ ]]
          test -n "$MARKETPLACE_PUBLISHER"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run package -- "$CHANNEL"
      - name: Record artifact checksum
        run: sha256sum dist/"$CHANNEL"/*.vsix > dist/"$CHANNEL"/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: marketplace-vsix
          path: dist/${{ env.CHANNEL }}/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    environment: marketplace-${{ inputs.channel || 'preview' }}
    env:
      CHANNEL: ${{ inputs.channel || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: marketplace-vsix
          path: dist/${{ env.CHANNEL }}
      - name: Verify packaged artifact
        run: sha256sum --check dist/"$CHANNEL"/SHA256SUMS
      - name: Publish tested VSIX
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
          MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
          TEST_ORGANIZATION: ${{ vars.AZURE_DEVOPS_TEST_ORG }}
        run: |
          test -n "$MARKETPLACE_PAT"
          test -n "$MARKETPLACE_PUBLISHER"
          arguments=()
          if [[ "$CHANNEL" = preview ]]; then
            test -n "$TEST_ORGANIZATION"
            arguments+=(--share-with "$TEST_ORGANIZATION")
          fi
          node node_modules/tfx-cli/_build/tfx-cli.js extension publish --vsix dist/"$CHANNEL"/*.vsix --auth-type pat --token "$MARKETPLACE_PAT" --no-wait-validation "${arguments[@]}"

          extension_id=poof-installer
          if [[ "$CHANNEL" = preview ]]; then
            extension_id+=-preview
          fi
          version="$(node -p "require('./package.json').version")"
          echo "Waiting for Marketplace validation of $MARKETPLACE_PUBLISHER.$extension_id@$version (maximum 30 minutes)."
          deadline=$((SECONDS + 1800))
          attempt=0
          while (( SECONDS < deadline )); do
            validation="$(node node_modules/tfx-cli/_build/tfx-cli.js extension isvalid \
              --publisher "$MARKETPLACE_PUBLISHER" \
              --extension-id "$extension_id" \
              --version "$version" \
              --service-url https://marketplace.visualstudio.com/ \
              --token "$MARKETPLACE_PAT" \
              --json)"
            status="$(printf '%s' "$validation" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).status")"
            case "$status" in
              success)
                echo "Marketplace validation succeeded for $MARKETPLACE_PUBLISHER.$extension_id@$version."
                exit 0
                ;;
              pending)
                attempt=$((attempt + 1))
                if (( attempt % 4 == 1 )); then
                  echo "Marketplace validation is still pending."
                fi
                sleep 30
                ;;
              *)
                echo "Marketplace validation failed: $validation" >&2
                exit 1
                ;;
            esac
          done
          echo "Marketplace validation did not finish within 30 minutes. Check its status before retrying publication." >&2
          exit 1
